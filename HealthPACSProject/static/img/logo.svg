<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Sfumatura argentata per la croce di sfondo -->
        <linearGradient id="silverCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.5" />
        </linearGradient>

        <!-- Sfumature per le cartelle azzurre -->
        <linearGradient id="folderBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0284c7" />
        </linearGradient>

        <!-- Sfumatura per l'anello dinamico -->
        <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#0369a1" />
            <stop offset="50%" stop-color="#00f0ff" />
            <stop offset="100%" stop-color="#e0f2fe" />
        </linearGradient>

        <!-- Effetto bagliore tenue -->
        <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- 1. Croce medica di sfondo (4 blocchi angolari con angoli smussati e fenditura centrali) -->
    <g stroke="url(#silverCrossGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- Braccio Superiore -->
        <path d="M 42 12 C 42 12, 42 22, 42 28 C 42 32, 58 32, 58 28 C 58 22, 58 12, 58 12 C 58 8, 42 8, 42 12 Z" />
        <!-- Braccio Destro -->
        <path d="M 88 42 C 88 42, 78 42, 72 42 C 68 42, 68 58, 72 58 C 78 58, 88 58, 88 58 C 92 58, 92 42, 88 42 Z" />
        <!-- Braccio Inferiore -->
        <path d="M 58 88 C 58 88, 58 78, 58 72 C 58 68, 42 68, 42 72 C 42 78, 42 88, 42 88 C 42 92, 58 92, 58 88 Z" />
        <!-- Braccio Sinistro -->
        <path d="M 12 58 C 12 58, 22 58, 28 58 C 32 58, 32 42, 28 42 C 22 42, 12 42, 12 42 C 8 42, 8 58, 12 58 Z" />
    </g>

    <!-- 2. Cartella 3 (Sfondo) -->
    <path d="M 40,26 L 52,26 L 55,29 L 69,29 A 2,2 0 0 1 71,31 L 71,51 A 2,2 0 0 1 69,53 L 40,53 A 2,2 0 0 1 38,51 L 38,28 A 2,2 0 0 1 40,26 Z" 
          fill="#0c4a6e" stroke="#0284c7" stroke-width="1.8" />

    <!-- 3. Cartella 2 (Intermedia) -->
    <path d="M 36,31 L 48,31 L 51,34 L 65,34 A 2,2 0 0 1 67,36 L 67,56 A 2,2 0 0 1 65,58 L 36,58 A 2,2 0 0 1 34,56 L 34,33 A 2,2 0 0 1 36,31 Z" 
          fill="#075985" stroke="#38bdf8" stroke-width="1.8" />

    <!-- 4. Cartella 1 (Primo piano) -->
    <path d="M 32,36 L 44,36 L 47,39 L 61,39 A 2,2 0 0 1 63,41 L 63,62 A 2,2 0 0 1 61,64 L 32,64 A 2,2 0 0 1 30,62 L 30,38 A 2,2 0 0 1 32,36 Z" 
          fill="url(#folderBlueGrad)" stroke="#00f0ff" stroke-width="1.5" filter="url(#softGlow)" />

    <!-- 5. Anello / Orbita dinamica tridimensionale -->
    <path d="M 22,54 C 20,68 45,74 65,64 C 78,57 79,47 68,44 C 60,41 42,46 32,50" 
          fill="none" stroke="url(#orbitGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#softGlow)" />
</svg>

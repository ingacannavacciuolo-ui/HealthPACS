<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/css/main_page.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/components/login_card.css">
    <link rel="stylesheet" href="/static/css/components/status_server_card.css">
    <link rel="stylesheet" href="/static/css/components/alert_server_card.css">
    
    <!-- Librerie esterne e Configurazione Globale dell'App -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script>
        const SOCKET_NAMESPACES = Object.freeze(JSON.parse('{{ SOCKET_NAMESPACES | tojson | safe }}'));
        const SOCKET_EVENTS = Object.freeze(JSON.parse('{{ SOCKET_EVENTS | tojson | safe }}'));
        const SERVICE_STATUS_STATES = Object.freeze(JSON.parse('{{ SERVICE_STATUS_STATES | tojson | safe }}'));
        const SEVERITY = Object.freeze(JSON.parse('{{ SEVERITY | tojson | safe }}'));        
    </script>
</head>
<body>
    <div class="login-page-wrapper">
        <!-- Card in alto dedicata solo alla Login Page -->
        <header class="login-top-bar">
           <div class="brand-logo">
                <!-- Logo SVG con sfondo trasparente -->
                <img src="/static/img/LogoSimbolo.png" alt="HealthPACS Logo" class="logo-image">

                <!-- Scritte affiancate a destra del logo -->
                <div class="logo-text">
                    <h1>Health<span class="highlight-pacs">PACS</span></h1>
                    <span>MEDICAL IMAGE MANAGEMENT</span>
                </div>
            </div>
                    
            <div class="top-bar-right">
                <!-- Inclusione della card dello Stato Server -->
                {% include "components/status_server_card.html" %}
            </div>
        </header>

        <!-- SEZIONE TITOLO CON CONTENITORI ALLERTE IN OVERLAY A SINISTRA -->
        <div class="title-section-wrapper">
            <!-- Contenitore unico per le allerte (posizionato in absolute a sinistra) -->
            <div class="alerts-overlay-left">
                <div id="container-critical-alerts" class="alerts-stack-container"></div>
                <div id="container-warning-alerts" class="alerts-stack-container"></div>
            </div>

            <!-- Titolo principale (rimane centrato e immobile) -->
            <div class="page-title">
                ACCESSO SISTEMA ARCHIVIAZIONE IMMAGINI (PACS)
            </div>

            <!-- Overlay Destro: INFO -->
            <div class="alerts-overlay-right">
                <div id="container-info-alerts" class="alerts-stack-container"></div>
            </div>
        </div>

        <main class="main-content-centered">
            <div class="left-panel">
                {% include "components/login_card.html" %}
            </div>

            <div class="right-panel">
               <!-- Spazio libero per il pannello di destra -->
            </div>
        </main>
    </div>

    <!-- Librerie esterne -->    
    <script src="/static/js/components/status_server_card.js"></script>
    <script src="/static/js/components/alert_server_card.js"></script>
    <script src="/static/js/components/login_card.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>

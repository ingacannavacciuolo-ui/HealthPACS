<!-- Componente modulare per lo Stato del Server -->
<div class="server-status-card status-disconnected" id="server-status-card">
    <div class="status-indicator">
        <span class="status-dot" id="server-status-dot"></span>
        <span class="status-ping-ring"></span>
    </div>
    <div class="status-info">
        <span class="status-label">{{ _(LANG_KEY.STATUS_LABEL) }}</span>
        <span class="status-value" id="server-status-text">{{ _(LANG_KEY.STATUS_DISCONNECTED) }}</span>
    </div>
</div>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HealthPACS{% endblock %}</title>

    <!-- FOGLIO DI STILE GLOBALE -->
     <link rel="stylesheet" href="/static/css/main_page.css">
    {% block extra_css %}{% endblock %}

    <script>
        window.TRANSLATIONS = Object.freeze(JSON.parse('{{ TRANSLATIONS | default({}) | tojson | safe }}'));
        const LANG_KEY = Object.freeze(JSON.parse('{{ LANG_KEY | tojson | safe }}'));
        const NOTIFY_ERROR = Object.freeze(JSON.parse('{{ NOTIFY_ERROR | tojson | safe }}'));
    </script>
</head>
<body>

    <header>
        <h2>HealthPACS Application</h2>
        <p>{{ _(LANG_KEY.LOGGED_USER) }} <strong>{{ user.username if user and user.username else 'Utente' }}</strong></p>
    </header>

    <hr>

    <!-- Area dinamica sostituita dalle pagine figlie -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <hr>

    <footer>
        <a href="/logout">{{ _(LANG_KEY.LOGOUT) }}</a>
    </footer>

    <!-- TOAST CONTAINER IN FONDO ALLA PAGINA -->
    <div id="toast-container"></div>

    <!-- Helper i18n da caricare PRIMA dei componenti -->
    <script src="/static/js/i18n.js"></script>

    <!-- SCRIPT GLOBALE -->
     <script src="/static/js/main_page.js"></script>    
    {% block extra_js %}{% endblock %}

</body>
</html>
